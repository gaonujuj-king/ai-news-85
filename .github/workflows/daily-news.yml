name: Update daily AI briefing

on:
  schedule:
    # 07:30 Korea Standard Time (UTC+9)
    - cron: '30 22 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/briefing.js'
      - 'scripts/refresh-news.mjs'
      - '.github/workflows/daily-news.yml'

permissions:
  contents: write

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node scripts/refresh-news.mjs
      - name: Save the briefing
        run: |
          git config user.name "AI Insight Daily bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/latest.json
          git diff --cached --quiet || git commit -m "chore: refresh daily briefing"
          git pull --rebase origin main
          git push origin HEAD:main
